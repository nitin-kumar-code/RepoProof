services:
  reproproof-api:
    build:
      context: ./reproproof-api
    environment:
      PORT: 4000
      CORS_ORIGIN: http://localhost:8080
      ALLOWED_TARGET_HOSTS: ${ALLOWED_TARGET_HOSTS:-localhost,127.0.0.1,approved-demo.example}
      ALLOWED_TARGET_PORTS: ${ALLOWED_TARGET_PORTS:-80,443,3000,4000,4173,5000,5173,8000,8080,8081,8443}
      PLANNER_MODE: ${PLANNER_MODE:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  reproproof-web:
    build:
      context: ./reproproof-web
    ports:
      - "8080:80"
    depends_on:
      reproproof-api:
        condition: service_healthy
