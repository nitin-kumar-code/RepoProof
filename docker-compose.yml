services:
  reproproof-api:
    build:
      context: ./reproproof-api
    env_file:
      - ./reproproof-api/.env
    shm_size: "2gb"
    environment:
      PORT: 4000
      APP_ENV: ${APP_ENV:-development}
      BUGLAB_BASE_URL: ${BUGLAB_BASE_URL:-http://host.docker.internal:4173}
      RUN_ARTIFACTS_DIR: /app/artifacts/runs
      EVIDENCE_STORAGE_BUCKET: ${EVIDENCE_STORAGE_BUCKET:-reproproof-evidence}
      VERIFICATION_RESET_URL: ${VERIFICATION_RESET_URL:-${BUGLAB_BASE_URL:-http://host.docker.internal:4173}/api/sandbox/reset}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      ALLOWED_TARGET_ORIGINS: ${ALLOWED_TARGET_ORIGINS:-${BUGLAB_BASE_URL:-http://host.docker.internal:4173}}
      ALLOWED_RESOURCE_ORIGINS: ${ALLOWED_RESOURCE_ORIGINS:-}
      PLANNER_MODE: ${PLANNER_MODE:-mock}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${RUN_ARTIFACTS_DIR:-./reproproof-api/artifacts}:/app/artifacts
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  reproproof-web:
    build:
      context: .
      dockerfile: reproproof-web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "8080:80"
    depends_on:
      reproproof-api:
        condition: service_healthy
