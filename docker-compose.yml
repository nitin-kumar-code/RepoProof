services:
  reproproof-api:
    build:
      context: ./reproproof-api
    environment:
      PORT: 4000
      APP_ENV: ${APP_ENV:-development}
      ALLOW_INSECURE_LOCAL_TARGETS: ${ALLOW_INSECURE_LOCAL_TARGETS:-false}
      CORS_ORIGIN: http://localhost:8080
      ALLOWED_TARGET_ORIGINS: ${ALLOWED_TARGET_ORIGINS:-}
      ALLOWED_RESOURCE_ORIGINS: ${ALLOWED_RESOURCE_ORIGINS:-}
      PLANNER_MODE: ${PLANNER_MODE:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      APPROVAL_USERNAME: ${APPROVAL_USERNAME:-}
      APPROVAL_PASSWORD: ${APPROVAL_PASSWORD:-}
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  reproproof-web:
    build:
      context: ./reproproof-web
    ports:
      - "8080:80"
    depends_on:
      reproproof-api:
        condition: service_healthy
